 }}}catch(_){}

function finishRun(metrics,reason){
 const r=state.run;if(!r||r.finished||!r.active||r.seconds<=0)return;r.finished=true;
 try{
  if(!r.id){setNotice('Run kept offline: this browser cannot create secure run identifiers.');return;}

 }catch(_){setNotice('The run could not be queued. Driving and the original local save are unaffected.');}
}

ndary">End current run & restart</button></div><div id="mp-run-state" class="mp-online-state" role="status"></div><div id="mp-pending-list"></div><p id="mp-storage-note" class="mp-online-note"></p>`);

function renderQueue(){

function friendly(error,kind){
 const m=String(error?.message||'').toLowerCase(),code=String(error?.code||'');
 if(m.includes('email not confirmed'))return 'Email confirmation is required. Open your confirmation email, then return here and sign in.';
 if(m.includes('invalid login credentials'))return 'Email or password was not accepted. Confirm your email first when required.';
 if(m.includes('password')&&(m.includes('short')||m.includes('least')||m.includes('weak')))return 'The password does not meet this project’s requirements. Choose a stronger password.';
 if(m.includes('already registered')||m.includes('already been registered'))return 'An account may already exist for that email. Try signing in.';
 if(m.includes('rate limit')||code==='over_email_send_rate_limit')return 'Too many requests. Wait before trying again; check for an existing confirmation email.';
 if(m.includes('please wait before submitting'))return 'The server allows one new run per 10 seconds. Wait, then retry this pending run.';
 if(m.includes('choose your player name'))return 'Choose and save your public player name in Account, then retry this run.';
 if(m.includes('sign in first')||code==='PGRST301'||m.includes('jwt expired'))return 'Sign in again, then retry. The run is still pending.';
 if(m.includes('outside allowed limits')||m.includes('check constraint'))return 'The run is outside the database limits and was not accepted. No score was fabricated.';
 if(m.includes('admin access required')||code==='42501')return 'Admin access was not authorized by the database.';
 if(kind==='auth')return 'The account request failed or timed out. Check your connection, email confirmation and Supabase Auth settings, then retry.';
 return 'Online request failed or timed out. Check your connection and project setup, then retry. Guest driving remains available.';
}

async function submitRun(entry,explicit){
 if(!state.queue.includes(entry)||state.busy.size||state.authBusy||state.nameBusy)return;const id=uid();

 if(entry.owner&&entry.owner!==id){setNotice('This run belongs to a different account. Sign in to that account to retry.');return;}
 if(!state.profileReady){entry.message='Pending · save your player name';setNotice('Save your public player name in Account before submitting this run.');renderQueue();if(explicit)goAccount();return;}
 if(!state.client){entry.message='Pending · online services unavailable';setNotice(entry.message);renderQueue();return;}
 if(Date.now()<state.cooldown){setNotice('Wait for the 10-second submission cooldown, then retry. This run remains pending.');return;}
 if(!entry.owner){if(!explicit){entry.message='Pending · guest runs require explicit submission';renderQueue();return;}entry.owner=id;persistQueue();}
 const runID=entry.payload.p_run_id,epoch=state.authEpoch;state.busy.add(runID);entry.message='Submitting immutable run snapshot…';renderAuth();
 try{
  const result=await rpc('mp_submit_run',entry.payload);
  if(!(typeof result==='number'||typeof result==='string')||!/^\d+$/.test(String(result))||Number(result)<=0)throw new Error('Invalid run acknowledgement');
  state.queue=state.queue.filter(q=>q.payload.p_run_id!==runID);persistQueue();state.cooldown=Date.now()+10200;setNotice('Run uploaded: '+fmtDistance(entry.payload.p_distance_m)+'. The leaderboard ranks each player by their best run only.');
  if(epoch===state.authEpoch&&!el('page-leaderboard').hidden)void loadLeaderboard(false);
 }catch(error){entry.message=friendly(error,'run');if(String(error?.message||'').toLowerCase().includes('please wait before submitting'))state.cooldown=Date.now()+10500;setNotice(entry.message+' Run remains pending with the same run ID for safe retry.');persistQueue();}
 finally{state.busy.delete(runID);renderAuth();if(state.cooldown>Date.now())setTimeout(renderQueue,state.cooldown-Date.now()+30);}
}
async function loadLeaderboard(explicit){
 if(state.leaderBusy)return;const now=Date.now();if(now<state.leaderNext){if(explicit)el('mp-leader-state').textContent='Refresh is limited to once every five seconds. Try again shortly.';return;}
 if(!state.client){el('mp-leader-state').textContent='Online services are unavailable. Retry connection in Account; no local or fabricated scores are shown.';return;}
 state.leaderBusy=true;state.leaderNext=now+5000;el('mp-leader-refresh').disabled=true;el('mp-leader-state').textContent='Loading live best-run records…';el('mp-leader-table').replaceChildren();
 try{const rows=await rpc('mp_leaderboard',{p_limit:50});if(!Array.isArray(rows))throw new Error('Invalid leaderboard response');if(!rows.length){el('mp-leader-state').textContent='No submitted runs yet. Sign in, save a name and finish a run to appear here.';return;}el('mp-leader-table').append(table(['Rank','Player','Best run distance','Vehicle','Recorded'],rows.map(r=>[r.place,r.display_name,fmtDistance(r.distance_m),r.vehicle,fmtDate(r.recorded_at)])));el('mp-leader-state').textContent='Live database records · top '+rows.length+' players · updated '+new Date().toLocaleTimeString();}
 catch(error){el('mp-leader-state').textContent=friendly(error,'leaderboard')+' No scores are available to display.';}
 finally{state.leaderBusy=false;setTimeout(()=>{el('mp-leader-refresh').disabled=false;},Math.max(0,state.leaderNext-Date.now()));}
}
async function loadAdmin(offset){
 if(state.adminBusy)return;if(!uid()){clearAdmin('Sign in first. The database must separately grant that account admin access.');return;}if(!state.client){clearAdmin('Online services are unavailable. No admin data can be read.');return;}
 const epoch=state.authEpoch,id=uid();state.adminBusy=true;el('mp-admin-refresh').disabled=true;clearAdmin('Verifying admin authorization with the database…');
 try{
  const allowed=await rpc('mp_is_admin');if(epoch!==state.authEpoch||uid()!==id)return;if(allowed!==true){clearAdmin('No admin access. Your login is valid, but this account is not authorized as an admin.');return;}
  el('mp-admin-state').textContent='Admin verified. Loading profiles and submitted runs…';const skip=Math.max(0,Math.floor(Number(offset)||0)),data=await rpc('mp_admin_overview',{p_limit:100,p_offset:skip});if(epoch!==state.authEpoch||uid()!==id)return;
  if(!data||!Array.isArray(data.players)||!Array.isArray(data.runs)||!Number.isFinite(Number(data.player_count))||!Number.isFinite(Number(data.run_count)))throw new Error('Invalid admin response');
  state.adminOffset=skip;state.adminMax=Math.max(Number(data.player_count),Number(data.run_count));el('mp-admin-counts').replaceChildren();for(const [label,value] of [['players',data.player_count],['runs',data.run_count]]){const n=document.createElement('span');n.textContent=Number(value).toLocaleString()+' '+label;el('mp-admin-counts').append(n);}
  if(data.players.length)el('mp-admin-players').append(table(['Player','Created','Updated'],data.players.map(p=>[p.display_name,fmtDate(p.created_at),fmtDate(p.updated_at)])));else el('mp-admin-players').textContent='No profiles on this page.';
  if(data.runs.length)el('mp-admin-runs').append(table(['Player','Run distance','Driving time','Coins earned','Max stars','Vehicle','Submitted'],data.runs.map(r=>[r.display_name,fmtDistance(r.distance_m),fmtDuration(r.duration_seconds),r.coins_earned,r.max_stars,r.vehicle,fmtDate(r.created_at)])));else el('mp-admin-runs').textContent='No runs on this page.';
  el('mp-admin-page').textContent='Page '+(Math.floor(skip/100)+1)+' · offset '+skip;el('mp-admin-prev').disabled=skip===0;el('mp-admin-next').disabled=skip+100>=state.adminMax;el('mp-admin-data').hidden=false;el('mp-admin-state').textContent='Server-authorized read-only view. Profiles and runs are independently paged in groups of 100.';
 }catch(error){if(epoch===state.authEpoch)clearAdmin(friendly(error,'admin'));}
 finally{state.adminBusy=false;el('mp-admin-refresh').disabled=false;}
}
async function timeoutFetch(input,options){const controller=new AbortController(),opts=options||{},timer=setTimeout(()=>controller.abort(),14000),abort=()=>controller.abort();if(opts.signal){if(opts.signal.aborted)controller.abort();else opts.signal.addEventListener('abort',abort,{once:true});}try{return await fetch(input,{...opts,signal:controller.signal});}finally{clearTimeout(timer);opts.signal?.removeEventListener('abort',abort);}}
function loadSDK(){if(window.supabase?.createClient)return Promise.resolve();return new Promise((resolve,reject)=>{const s=document.createElement('script');s.async=true;s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';const timer=setTimeout(()=>{s.remove();reject(new Error('SDK timeout'));},12000);s.onload=()=>{clearTimeout(timer);window.supabase?.createClient?resolve():reject(new Error('SDK unavailable'));};s.onerror=()=>{clearTimeout(timer);s.remove();reject(new Error('SDK network error'));};document.head.append(s);});}
function withTimeout(promise,ms){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('Request timeout')),ms);Promise.resolve(promise).then(v=>{clearTimeout(t);resolve(v);},e=>{clearTimeout(t);reject(e);});});}
function scrubAuthURL(){try{const url=new URL(location.href);let changed=false;if(/(?:access_token|refresh_token|token_type|error_description|error_code)=/.test(url.hash)){url.hash='';changed=true;}for(const key of ['code','error','error_description','error_code'])if(url.searchParams.has(key)){url.searchParams.delete(key);changed=true;}if(changed)history.replaceState(null,'',url);}catch(_){}}
async function connect(){
 if(state.connecting)return;state.connecting=true;renderAuth();accountMessage('Connecting online services in the background. Guest play starts independently.');let message='';
 try{
  if(!state.client){await loadSDK();const storage={getItem:safeRead,setItem:safeWrite,removeItem:safeRemove};
   state.client=window.supabase.createClient(PROJECT,PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage,storageKey:'midnightPursuitAuth_v1'},global:{fetch:timeoutFetch}});
   state.client.auth.onAuthStateChange((_event,session)=>{applySession(session);});
  }
  const epoch=state.authEpoch,result=await withTimeout(state.client.auth.getSession(),18000);if(result.error)throw result.error;if(epoch===state.authEpoch)applySession(result.data?.session||null);
  if(!uid())message='Guest mode. View the live leaderboard or sign in to submit a finished run. New accounts may require email confirmation.';if(!el('page-leaderboard').hidden)void loadLeaderboard(false);
 }catch(_){message=state.client?'Session restoration failed or timed out. Sign in manually or retry online connection. Guest driving still works.':'Online services could not load. Guest driving is unaffected. Reconnect and press Retry online connection.';}
 finally{scrubAuthURL();state.connecting=false;renderAuth();if(message)accountMessage(message);}
}
el('mp-auth-form').onsubmit=e=>{e.preventDefault();void authAction('login');};el('mp-signup').onclick=()=>void authAction('signup');el('mp-name-form').onsubmit=saveName;
el('mp-logout').onclick=async()=>{if(!state.client||state.authBusy||state.nameBusy)return;if(state.busy.size){accountMessage('A run submission is in progress. Wait for it to finish or time out before signing out.');return;}state.authBusy=true;renderAuth();let message='';try{const result=await withTimeout(state.client.auth.signOut(),20000);if(result.error)throw result.error;applySession(null);message='Signed out. Guest play and your local garage remain available.';}catch(error){message=friendly(error,'auth');}finally{state.authBusy=false;renderAuth();accountMessage(message);}};
el('mp-reconnect').onclick=()=>void connect();el('mp-submit-last').onclick=()=>{const q=state.queue[state.queue.length-1];if(q)void submitRun(q,true);};el('mp-end-run').onclick=()=>{if(confirm('End this run, capture its distance, then restart with free repair?'))el('restartButton').click();};el('mp-leader-refresh').onclick=()=>void loadLeaderboard(true);el('mp-leader-account').onclick=goAccount;leaderboardTab.addEventListener('click',()=>void loadLeaderboard(false));adminTab.addEventListener('click',()=>void loadAdmin(state.adminOffset));el('mp-admin-refresh').onclick=()=>void loadAdmin(state.adminOffset);el('mp-admin-account').onclick=goAccount;el('mp-admin-prev').onclick=()=>void loadAdmin(Math.max(0,state.adminOffset-100));el('mp-admin-next').onclick=()=>void loadAdmin(state.adminOffset+100);
addEventListener('error',event=>{if(event instanceof ErrorEvent&&!state.ready)fatal(false);});setTimeout(()=>{if(!state.ready&&!state.failed)fatal(true);},22000);
renderAuth();setNotice(state.queue.length?'You have '+state.queue.length+' pending run(s). Nothing is marked uploaded until the server confirms it.':'Finish a run with Restart / R to capture its final distance.');void connect();bootStage('Restoring saved garage, settings and keybindings…');
}
const BOOT_CSS=document.querySelector('style').textContent;
function once(source,needle,replacement){const first=source.indexOf(needle);if(first<0||source.indexOf(needle,first+needle.length)>=0)throw new Error('Compatibility check failed. Upload the matching unchanged game-base.html supplied with this index.html. No partial game was started and your save was not changed.');return source.slice(0,first)+replacement+source.slice(first+needle.length);}

 let source=String(raw).replace(/^\uFEFF/,'');if(/^\s*&lt;(?:!doctype|html)/i.test(source)){const t=document.createElement('textarea');t.innerHTML=source;source=t.value;}
 if(source.length<100000||source.length>2000000||!source.includes("SAVE_KEY='endlessDriveCoins_v1'")||!source.includes('missionTemplates')||!source.includes('HELICOPTER'))throw new Error('game-base.html is not the matching complete game. Upload the original helicopter/garage game under exactly that filename, without editing or truncating it.');
 source=once(source,"for(const n of ['upgrades','dealership','customize','missions'])","for(const n of ['upgrades','dealership','customize','missions','account','leaderboard','admin'])");
 source=once(source,"function resetRunPosition(freeRepair=false){endInfoPreview();","function resetRunPosition(freeRepair=false){endInfoPreview();window.MP.finish({distance,coins:runCoins,stars,vehicle:activeModel().name},freeRepair?'Restart / free repair':'Position reset');window.MP.reset();");
 source=once(source,'save();equipped=m.id;rebuildPlayer();resetRunPosition(false);',"window.MP.finish({distance,coins:runCoins,stars,vehicle:activeModel().name},'Vehicle change');save();equipped=m.id;rebuildPlayer();resetRunPosition(false);");

 source=once(source,'const scene=new THREE.Scene(),sky=',"window.MP.boot('Creating WebGL renderer, lights and materials…');const scene=new THREE.Scene(),sky=");
 source=once(source,'const SIZE=120,chunks=',"window.MP.boot('Constructing vehicle meshes and district systems…');const SIZE=120,chunks=");
 source=once(source,'// All save, deformation, graph, exhaust, pursuit, station and input state exists before initial rebuild.',"window.MP.boot('Applying saved condition, streaming the world and preparing the first frame…');\n// All save, deformation, graph, exhaust, pursuit, station and input state exists before initial rebuild.");
 source=once(source,'renderer.render(scene,camera);}',"renderer.render(scene,camera);window.MP.ready();}");
 source=once(source,"if(typeof THREE==='undefined'){document","if(typeof THREE==='undefined'){window.MP.fatal(false);document");
 const endScript='<'+'/script>';

 source=once(source,'<body>','<body>'+newBoot);
 const three='<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js">'+endScript;

const stage=document.getElementById('mp-boot-stage'),log=document.getElementById('mp-boot-log'),help=document.getElementById('mp-boot-help'),retry=document.getElementById('mp-source-retry');let loading=false;
function stageText(text){stage.textContent=text;const li=document.createElement('li');li.textContent=text;log.append(li);while(log.children.length>6)log.firstElementChild.remove();}
async function fetchGame(){
 if(location.protocol!=='https:'&&location.protocol!=='http:')throw new Error('Deploy index.html and game-base.html together on GitHub Pages, then open the website. Opening index.html by double-clicking is not supported.');
 const url=new URL('./game-base.html',location.href);if(url.origin!==location.origin)throw new Error('The game must load from this website.');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{const response=await fetch(url.href,{signal:controller.signal,credentials:'same-origin',cache:'no-store',redirect:'error'});if(!response.ok)throw new Error('Could not load game-base.html (HTTP '+response.status+'). Upload it beside index.html in the folder published by GitHub Pages, wait for deployment, then retry.');const text=await response.text();if(text.length<100000||text.length>2000000)throw new Error('game-base.html is missing, incomplete, or not the original game. Upload the complete supplied file beside index.html.');return text;}
 catch(error){if(error.name==='AbortError')throw new Error('game-base.html took too long to load. Check your connection and that both files are published together, then retry.');if(error instanceof TypeError)throw new Error('Could not fetch game-base.html. Check your connection and upload the complete file beside index.html, with that exact lowercase filename.');throw error;}
 finally{clearTimeout(timer);}
}
async function start(){
 if(loading)return;loading=true;retry.hidden=true;help.classList.remove('mp-error');help.textContent='Guest play starts without waiting for accounts or leaderboard requests.';
 try{stageText('Downloading game-base.html from this website…');const text=await fetchGame();stageText('Checking matching game version and connecting game events…');const combined=integrate(text);stageText('Starting the complete game and graphics…');await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));document.open();document.write(combined);document.close();}
 catch(error){stageText('Game startup stopped.');help.classList.add('mp-error');help.textContent=error?.message||'Could not start the game. Check both published files and retry.';retry.hidden=false;}
 finally{loading=false;}
}
retry.onclick=start;void start();
